# flake8-docstrings (pydocstyle) ships D100-D419; only D101, D102 and D103 (public class, method,
# function) are enforced project-wide. The rest of the D1xx codes and all of D2xx/D3xx/D4xx
# (blank-line, summary-line and formatting conventions) are switched off here rather than per file,
# so the "about 120 defs" work list from Step 1 is docstring presence only, not prose style.
extend-ignore = E203, W503, D100, D104, D105, D106, D107, D2, D3, D4
exclude = build,dist,.eggs,.git,__pycache__,.tox,.venv,venv
