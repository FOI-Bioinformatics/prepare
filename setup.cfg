    prepare/utils/__init__.py:D101,D102,D103
    prepare/utils/browser.py:B902,D101,D102,D103
    prepare/utils/html.py:B902,D101,D102,D103
    prepare/utils/logging.py:D101,D102,D103
    prepare/utils/security.py:B902,D101,D102,D103
    prepare/visualization/__init__.py:D101,D102,D103
    prepare/visualization/explorer.py:D101,D102,D103
    prepare/visualization/interactive.py:B902,D101,D102,D103
    prepare/visualization/plots.py:B902,D101,D102,D103
