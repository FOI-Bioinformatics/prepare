[flake8]
max-line-length = 120
max-complexity = 15
# Test fakes are dispatch tables by design; the CI lints prepare only.
# B902 (flake8-blind-except) flags `except Exception`. The modules listed with B902 still hold
# broad handlers that have not been narrowed yet; each is removed from the list once it is.
# D101/D102/D103 (flake8-docstrings) require a docstring on every public class, method and
# function. They are enforced only on prepare/data/registry.py, prepare/data/sra/*.py (space.py, spots.py, run_report.py),
# prepare/cli/commands/store/*.py, prepare/cli/commands/status/*.py,
# prepare/processing/selection.py, prepare/processing/results.py,
# prepare/processing/status_report.py, prepare/processing/project_funnel.py,
# prepare/store/*.py, prepare/cli/commands/renamed.py,
# prepare/cli/commands/sra_profile.py, prepare/cli/commands/sra_report.py, prepare/cli/commands/sra_verdicts.py,
# prepare/sra/dataset_stats.py, prepare/sra/profiles.py, prepare/sra/quality.py,
# prepare/core/optional.py, prepare/core/settings.py, prepare/data/registry_blocks.py,
# prepare/data/registry_batch.py, prepare/data/assembly.py, prepare/data/registry_assembly.py,
# prepare/data/registry_reconcile.py, prepare/data/assembly_identity.py, prepare/utils/lockfile.py,
# prepare/utils/termination.py, prepare/utils/progress.py, prepare/utils/resources.py,
# prepare/data/extraction_locks.py, prepare/data/extraction_staging.py,
# prepare/utils/tools.py, prepare/processing/doctor_report.py, prepare/cli/commands/extraction_assembly.py,
# prepare/data/registry_timing.py, prepare/data/metadata_fields.py, prepare/cli/commands/doctor.py,
# prepare/utils/xml.py, prepare/utils/http.py, prepare/data/run_log.py,
# prepare/processing/run_diff.py, prepare/cli/commands/runs.py, prepare/processing/project_report.py,
# prepare/processing/project_report_markdown.py, prepare/visualization/project_report.py and
# prepare/cli/commands/project_report.py;
# every other module is listed below with D101,D102,D103 ignored so the enforced set stays
# explicit and can grow later without a wildcard silently exempting new files.
# flake8 applies only the longest matching pattern, so a test file listed here repeats C901.
per-file-ignores =
    tests/*:C901,D101,D102,D103
    tests/test_security_comprehensive.py:C901,B902,D101,D102,D103
    prepare/__init__.py:D101,D102,D103
    prepare/cli/__init__.py:D101,D102,D103
    prepare/cli/base.py:D101,D102,D103
    prepare/cli/commands/__init__.py:D101,D102,D103
    prepare/cli/commands/advanced_analysis.py:B902,D101,D102,D103
    prepare/cli/commands/blacklist.py:D101,D102,D103
    prepare/cli/commands/branchwater.py:D101,D102,D103
    prepare/cli/commands/branchwater_search.py:D101,D102,D103
    prepare/cli/commands/containment.py:D101,D102,D103
    prepare/cli/commands/explore.py:D101,D102,D103
    prepare/cli/commands/genome.py:D101,D102,D103
    prepare/cli/commands/metadata.py:D101,D102,D103
    prepare/cli/commands/read_extraction.py:B902,D101,D102,D103
    prepare/cli/commands/results.py:D101,D102,D103
    prepare/cli/commands/samples.py:D101,D102,D103
    prepare/cli/commands/select.py:D101,D102,D103
    prepare/cli/commands/sra.py:D101,D102,D103
    prepare/cli/commands/sra_enhanced.py:B902,D101,D102,D103
    prepare/cli/commands/test_data.py:D101,D102,D103
    prepare/cli/main.py:B902,D101,D102,D103
    prepare/core/__init__.py:D101,D102,D103
    prepare/core/constants.py:D101,D102,D103
    prepare/core/exceptions.py:D101,D102,D103
    prepare/core/models.py:D101,D102,D103
    prepare/core/utils.py:D101,D102,D103
    prepare/core/validation.py:B902,D101,D102,D103
    prepare/data/__init__.py:D101,D102,D103
    prepare/data/branchwater.py:D101,D102,D103
    prepare/data/branchwater_search.py:D101,D102,D103
    prepare/data/defaults.py:D101,D102,D103
    prepare/data/file_io.py:B902,D101,D102,D103
    prepare/data/genome_download.py:B902,D101,D102,D103
    prepare/data/genome_taxonomy.py:D101,D102,D103
    prepare/data/gtdb.py:D101,D102,D103
