[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prepare"
version = "0.12.1"
description = "A toolkit for analyzing metagenomic datasets based on genome containment"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Andreas Sjödin", email = "andreas.sjodin@gmail.com"}  # ascii-ok: author name
]
maintainers = [
    {name = "Andreas Sjödin", email = "andreas.sjodin@gmail.com"}  # ascii-ok: author name
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
]
requires-python = ">=3.12"
# Core runtime: enough to load the CLI, download data, parse containment and draw the
# matplotlib figures. Everything else sits behind an extra and is imported when a command
# needs it; a missing package is reported with the install command for its extra.
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "biopython>=1.82",
    "lxml>=4.9.3",
    "requests>=2.31",
]

[project.optional-dependencies]
# PCA, t-SNE, clustering, non-Bray-Curtis beta diversity and group statistics
analysis = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
]
# Plotly figures and jinja2-rendered HTML reports, dashboards and the containment explorer
interactive = [
    "plotly>=5.18",
    "jinja2>=3.1",
]
# Geographic sample maps
maps = [
    "cartopy>=0.22",
]
# Sketching a genome for branchwater_search, and the sourmash CLI plugin
sourmash = [
    "sourmash>=4.8",
]
all = [
    "prepare[analysis,interactive,maps,sourmash]",
]
# The test suite exercises every optional path, so the development extra includes them all.
dev = [
    "prepare[all]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=3.0.0",
    "flake8>=7.0",
    "flake8-blind-except>=0.2",
    "flake8-docstrings>=1.7",
    "black>=24.0",
    "mypy>=1.8",
    "radon>=6.0",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/FOI-Bioinformatics/prepare"
Repository = "https://github.com/FOI-Bioinformatics/prepare"
Issues = "https://github.com/FOI-Bioinformatics/prepare/issues"

[project.scripts]
prepare = "prepare.cli.main:main"

[project.entry-points."sourmash.cli_script"]
prepare_parse = "prepare.plugins.sourmash_plugin:PrepareParsePlugin"
prepare_plot = "prepare.plugins.sourmash_plugin:PreparePlotPlugin"
prepare_diversity = "prepare.plugins.sourmash_plugin:PrepareDiversityPlugin"
prepare_taxonomy = "prepare.plugins.sourmash_plugin:PrepareTaxonomyPlugin"

[tool.setuptools.packages.find]
include = ["prepare*"]

[tool.setuptools.package-data]
prepare = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
explicit_package_bases = true

# These third-party libraries ship no inline types, and their stub packages are
# not runtime dependencies. Missing-import errors from them are environmental
# noise rather than type defects, so they are ignored here.
[[tool.mypy.overrides]]
module = [
    "requests",
    "requests.*",
    "pandas",
    "pandas.*",
    "lxml",
    "lxml.*",
    "Bio",
    "Bio.*",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
    "plotly",
    "plotly.*",
    "matplotlib",
    "matplotlib.*",
    "cartopy",
    "cartopy.*",
    "sourmash",
    "sourmash.*",
]
ignore_missing_imports = true

# Modules held to fully annotated definitions.
[[tool.mypy.overrides]]
module = ["prepare.data.registry_blocks"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers -m 'not network'"
testpaths = ["tests"]
# Import the package from the checkout under test, not from the editable install's path,
# so a git worktree tests its own copy.
pythonpath = ["."]
markers = [
    "network: calls NCBI or SRA over the internet; run explicitly with 'pytest -m network'",
    "perf: timing or memory bound, runs by default; time bounds scale with PREPARE_PERF_SCALE (CI sets 4)",
    "multiprocess: starts real processes (the CLI with fake tools on PATH, no network); runs by default",
]

[tool.coverage.run]
source = ["prepare"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]