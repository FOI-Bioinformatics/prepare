name: Branchwater Integration

on:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight
  workflow_dispatch:  # Allow manual triggering

jobs:
  branchwater-test:
    name: Branchwater Integration Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      
      - name: Install PREPARE
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Download test data
        run: |
          mkdir -p test_data/branchwater
          # Create a proper Branchwater-formatted CSV file
          echo "acc,containment,cANI,biosample,bioproject,assay_type,collection_date_sam,geo_loc_name_country_calc,organism,lat_lon" > test_data/branchwater/example.csv
          echo "SRR12345678,0.95,0.98,SAMN12345678,PRJNA123456,AMPLICON,2019-05-01,USA,Francisella adeliensis,35.7N 100.2W" >> test_data/branchwater/example.csv
          echo "SRR87654321,0.92,0.96,SAMN87654321,PRJNA123456,AMPLICON,2019-06-15,USA,Francisella adeliensis,36.1N 99.8W" >> test_data/branchwater/example.csv
          
          # Let's also create a debug file to check the content format
          cat test_data/branchwater/example.csv
      
      - name: Process Branchwater files
        run: |
          mkdir -p test_data/processed
          prepare use_branchwater --branchwater-folder test_data/branchwater --matches-folder test_data/processed
      
      - name: Extract metadata
        run: |
          mkdir -p test_data/metadata
          prepare extract_branchwater_metadata --branchwater-folder test_data/branchwater --metadata-folder test_data/metadata
      
      - name: Parse containment
        run: |
          # Use proper argument syntax with hyphens instead of underscores
          prepare parse_containment --matches-folder test_data/processed --parsed-containment-file test_data/parsed_containment.txt --summary-containment-file test_data/summary_containment.txt
      
      - name: Verify outputs
        run: |
          # The fixture files above are synthetic and always identical (2 accessions,
          # a fixed column set), so the checks below assert on the exact shape the
          # pipeline is expected to produce, not just that a file exists. Any assertion
          # failure raises and fails this step, unlike the previous echo-only check.
          python -c "
          import csv
          from pathlib import Path

          def read_rows(path, delimiter=','):
              with open(path, newline='') as fh:
                  return list(csv.reader(fh, delimiter=delimiter))

          processed = Path('test_data/processed/example.csv')
          assert processed.is_file(), f'missing {processed}'
          rows = read_rows(processed)
          expected_columns = [
              'acc', 'containment', 'cANI', 'biosample', 'bioproject', 'assay_type',
              'collection_date_sam', 'geo_loc_name_country_calc', 'organism', 'lat_lon',
          ]
          assert rows[0] == expected_columns, f'unexpected columns in {processed}: {rows[0]}'
          assert len(rows) - 1 == 2, f'expected 2 data rows in {processed}, got {len(rows) - 1}'
          print(f'processed CSV OK: {len(rows) - 1} rows, {len(rows[0])} columns')

          metadata = Path('test_data/metadata/branchwater_metadata.txt')
          assert metadata.is_file(), f'missing {metadata}'
          meta_rows = read_rows(metadata, delimiter='\t')
          assert 'Run_ID' in meta_rows[0], f'Run_ID missing from metadata header: {meta_rows[0]}'
          assert len(meta_rows) - 1 == 2, f'expected 2 metadata rows, got {len(meta_rows) - 1}'
          print(f'metadata OK: {len(meta_rows) - 1} rows')

          parsed = Path('test_data/parsed_containment.txt')
          assert parsed.is_file(), f'missing {parsed}'
          parsed_rows = read_rows(parsed, delimiter='\t')
          header = parsed_rows[0]
          for column in ('max_containment', 'max_containment_annotation'):
              assert column in header, f'{column} missing from parsed containment header: {header}'
          assert len(parsed_rows) - 1 == 2, f'expected 2 parsed containment rows, got {len(parsed_rows) - 1}'
          print(f'parsed containment OK: {len(parsed_rows) - 1} rows')

          summary = Path('test_data/summary_containment.txt')
          assert summary.is_file(), f'missing {summary}'
          summary_rows = read_rows(summary, delimiter='\t')
          assert summary_rows[0] == ['Threshold', 'Count'], f'unexpected summary header: {summary_rows[0]}'
          assert len(summary_rows) - 1 > 0, 'no rows in summary containment file'
          print(f'summary containment OK: {len(summary_rows) - 1} rows')
          "