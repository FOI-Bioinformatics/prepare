name: PREPARE Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build, verify and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents

      - name: Check the tag against the package version
        run: python scripts/check_version.py --tag "${GITHUB_REF_NAME}"

      - name: Run the test suite
        env:
          # Shared runners are slower than the machine the perf bounds were measured on.
          PREPARE_PERF_SCALE: "4"
        run: |
          pip install ".[dev]"
          pytest tests/ -q -x

      - name: Build package
        run: python -m build

      - name: Check wheel contents
        run: check-wheel-contents dist/*.whl

      - name: Check distribution with twine
        run: twine check dist/*

      - name: Extract changelog section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            # The dots in the version are matched literally ("[.]"), so 0.4.0 cannot match 0x4y0.
            BEGIN { found = 0; pat = ver; gsub(/\./, "[.]", pat) }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" pat "\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION." > release_notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: release_notes.md

      - name: Upload the built distribution for the pypi job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the distribution built by the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Publishing to PyPI needs a PyPI trusted-publisher configured for this repository and
      # workflow (https://docs.pypi.org/trusted-publishers/), so no token or secret is passed
      # here; the `id-token: write` permission above is what lets pypa/gh-action-pypi-publish
      # request the short-lived credential that trusted publishing uses. This job only runs
      # once the repository variable PYPI_PUBLISH is set to "true" (Settings > Secrets and
      # variables > Actions > Variables); see docs/packaging.md for the steps before turning it
      # on (name registration, trusted-publisher setup, README/floor checks).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
