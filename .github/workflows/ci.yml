name: PREPARE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy pytest black radon
          pip install -e ".[dev]"

      - name: Audit dependencies for known vulnerabilities
        run: |
          # Audit the project path (not the installed environment) so pip-audit resolves
          # dependencies from pyproject.toml instead of trying to look up the local,
          # unpublished "prepare" package itself on PyPI.
          # --desc takes an optional value, so a bare "--desc ." would swallow the "."
          # path argument as an (invalid) choice for --desc; --desc=auto avoids that.
          pip-audit --strict --desc=auto .

      - name: Run the local quality gate
        run: make check

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e ".[dev]"

      - name: Test with pytest
        env:
          # Shared runners are slower than the machine the perf bounds were measured on.
          PREPARE_PERF_SCALE: "4"
        run: |
          pytest tests/ --cov=prepare --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build and verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents

      - name: Build package
        run: python -m build

      - name: Check version consistency
        run: python scripts/check_version.py

      - name: Check wheel contents
        run: check-wheel-contents dist/*.whl

      - name: Check that the typed marker ships
        run: unzip -l dist/*.whl | grep prepare/py.typed

      - name: Check distribution with twine
        run: twine check dist/*

      - name: Test installation
        run: |
          pip install dist/*.whl
          python -c "import prepare; print(prepare.__version__)"

      - name: Archive distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install package
        run: pip install dist/*.whl

      - name: Install test dependencies
        run: pip install pytest

      - name: Download test genome
        run: |
          mkdir -p test_data
          prepare download_test_genome --output-folder test_data

      - name: Run basic CLI commands
        run: |
          prepare --help
          prepare --version

      - name: Verify integration
        run: |
          # Verify test genome was downloaded
          test -f test_data/GCF_000008985.1.fasta && echo "Test genome downloaded successfully" || exit 1

          # Create a test Branchwater file for processing
          mkdir -p test_data/branchwater
          echo "acc,containment,cANI,biosample,bioproject,assay_type" > test_data/branchwater/example.csv
          echo "SRR12345678,0.95,0.98,SAMN12345678,PRJNA123456,AMPLICON" >> test_data/branchwater/example.csv

          # Test basic Branchwater processing
          mkdir -p test_data/processed
          prepare use_branchwater --branchwater-folder test_data/branchwater --matches-folder test_data/processed

          # Verify output
          test -f test_data/processed/example.csv && echo "Branchwater processing successful" || exit 1