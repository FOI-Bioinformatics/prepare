name: PREPARE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install the package with the dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the local quality gate
        run: make check

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux on both supported Python versions; macOS only on the newest, since the
        # OS-specific paths (symlinks, locks, subprocesses) do not depend on the Python minor.
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install the package with the dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        env:
          # Shared runners are slower than the machine the perf bounds were measured on.
          PREPARE_PERF_SCALE: "4"
        run: pytest tests/

  build:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents

      - name: Build package
        run: python -m build

      - name: Check version consistency
        run: python scripts/check_version.py

      - name: Check wheel contents
        run: check-wheel-contents dist/*.whl

      - name: Check that the typed marker ships
        run: unzip -l dist/*.whl | grep prepare/py.typed

      - name: Check distribution with twine
        run: twine check dist/*

      - name: Install the wheel and run the CLI
        # The wheel alone, without the dev extra: checks the entry point, the package data and
        # that the parser builds with only the core dependencies. No network is used.
        run: |
          pip install dist/*.whl
          python -c "import prepare; print(prepare.__version__)"
          prepare --version
          prepare --help
          mkdir -p ci_smoke/branchwater
          printf 'acc,containment,cANI,biosample,bioproject,assay_type\nSRR12345678,0.95,0.98,SAMN12345678,PRJNA123456,AMPLICON\n' > ci_smoke/branchwater/example.csv
          prepare use_branchwater --branchwater-folder ci_smoke/branchwater --matches-folder ci_smoke/processed
          test -f ci_smoke/processed/example.csv
